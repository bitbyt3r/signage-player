# Development build: kernel messages and a root shell on the serial port and
# on tty2. Build with: mkosi --profile=debug -f build
[Match]
Profiles=debug

[Content]
KernelCommandLine=console=tty0 console=ttyS0,115200 systemd.show_status=yes
ExtraTrees=%D/mkosi.debug.extra
Packages=
        openssh-client
        strace
        pciutils
        usbutils
        nano
