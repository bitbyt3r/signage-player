# The stick's writable root. Same shape the installer gives the internal
# disk: /etc from the image, the merged-/usr symlinks, empty /var.
[Partition]
Type=root
Label=root
Format=ext4
CopyFiles=/etc:/etc
MakeSymlinks=/bin:usr/bin /sbin:usr/sbin /lib:usr/lib /lib64:usr/lib64
MakeDirectories=/usr /var /home /srv /root /tmp /mnt /efi /boot /proc /sys /dev /run
SizeMinBytes=1G
SizeMaxBytes=1G
