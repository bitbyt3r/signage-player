# FAT32 partition any laptop can open, holding config.toml. Microsoft basic
# data type so Windows and macOS mount it.
[Partition]
Type=ebd0a0a2-b9e5-4433-87c0-68b6b72699c7
Label=SIGNCFG
Format=vfat
CopyFiles=/usr/share/signage/config.example.toml:/config.toml
CopyFiles=/usr/share/signage/README-config.txt:/README.txt
SizeMinBytes=256M
SizeMaxBytes=256M
