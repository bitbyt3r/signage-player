# Read-only /usr, protected by dm-verity. mkosi puts usrhash= on the UKI's
# command line, so a UKI only boots the /usr it was built with.
[Partition]
Type=usr
Label=%M_usr_%A
Format=erofs
CopyFiles=/usr:/
Verity=data
VerityMatchKey=usr
Minimize=best
# lzma level 6 in 256 KiB physical clusters (the cluster size comes from
# SYSTEMD_REPART_MKFS_OPTIONS_EROFS in mkosi.conf; repart has no setting for
# it). Measured on the trimmed tree (1087 MiB of files):
#   zstd 9, 128K: 431 MiB, 30 s, 410 MiB as the zstd -19 release download
#   lzma 6, 256K: 369 MiB, 38 s, 351 MiB      <- this
#   lzma 6, 1M:   362 MiB, 47 s, 344 MiB (more read amplification)
# zstd decompresses faster, but compressed data doesn't recompress, so it
# made the downloads ~60 MiB bigger than the uncompressed image used to be.
Compression=lzma
CompressionLevel=6

VerityDataBlockSizeBytes=4096
VerityHashBlockSizeBytes=4096
