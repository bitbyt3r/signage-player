[Partition]
Type=usr-verity
Label=%M_verity_%A
Verity=hash
VerityMatchKey=usr
Minimize=best

# 4K verity blocks. They default to the image sector size, and with SectorSize=512
# (mkosi.conf) the hash tree grew from 3 to 24 MiB with 8x the hashing work.
VerityDataBlockSizeBytes=4096
VerityHashBlockSizeBytes=4096
