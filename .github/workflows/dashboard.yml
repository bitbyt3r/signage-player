name: dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/**", "mkosi.extra/usr/lib/signage/signage-config", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["dashboard/**", "mkosi.extra/usr/lib/signage/signage-config", ".github/workflows/dashboard.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install boto3 "moto[server,dynamodb,s3]" pytest cfn-lint websockets
      - run: cfn-lint template.yaml
      - name: Live view test dependencies (GStreamer WebRTC, ffmpeg, Chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gstreamer1.0-plugins-bad gstreamer1.0-plugins-good gstreamer1.0-nice python3-gst-1.0 gir1.2-gst-plugins-bad-1.0
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >>"$GITHUB_ENV"
      - run: python -m pytest -q tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pearl page and copy planner (node)
        run: node --test tests/pearls_copy_test.mjs ../tests/pearl/room.test.mjs
      - name: FAT32 builder
        run: |
          sudo apt-get install -y dosfstools
          node tests/fat32_test.mjs /tmp/fat.img
          fsck.fat -n /tmp/fat.img
