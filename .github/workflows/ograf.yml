name: OGraf packages

on:
  push:
    paths: ["packages/**", "scripts/package-ograf.sh", ".github/workflows/ograf.yml"]
  pull_request:
    paths: ["packages/**", "scripts/package-ograf.sh", ".github/workflows/ograf.yml"]
  workflow_dispatch:

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the graphics' JavaScript parses
        run: for f in packages/*/*.mjs; do node --check "$f"; done
      - name: Zip each package
        run: scripts/package-ograf.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ograf-packages
          path: dist/ograf/*.zip
