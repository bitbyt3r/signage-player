name: image
on:
  push: {branches: [main], tags: ["v*"]}
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mkosi
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx bubblewrap uidmap zstd xz-utils
          sudo pipx install --global git+https://github.com/systemd/mkosi.git@v25.3
      - name: Version
        id: v
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          else echo "version=$(cat mkosi.version).$(date -u +%y%m%d%H%M)" >>"$GITHUB_OUTPUT"; fi
      - name: Build
        run: sudo mkosi --image-version=${{ steps.v.outputs.version }} -f build
      - name: Package
        run: |
          cd mkosi.output && sudo chown -R "$USER" .
          V=${{ steps.v.outputs.version }}; mkdir ../dist
          xz -T0 -6 -c signage_$V.raw >../dist/signage_$V.raw.xz
          # sysupdate.d expects signage_<version>.<partition>.<partuuid>.raw.zst:
          # the UKI's usrhash= finds /usr and its verity partition by UUID, so
          # updates must recreate them with the same UUIDs.
          uuid() { sfdisk -J signage_$V.raw | jq -r --arg n "$1" '.partitiontable.partitions[] | select(.name == $n) | .uuid | ascii_downcase'; }
          zstd -19 -T0 -q signage_$V.usr-x86-64.raw -o ../dist/signage_$V.usr-x86-64.$(uuid signage_usr_$V).raw.zst
          zstd -19 -T0 -q signage_$V.usr-x86-64-verity.raw -o ../dist/signage_$V.usr-x86-64-verity.$(uuid signage_verity_$V).raw.zst
          cp signage_$V.efi ../dist/
          cd ../dist && sha256sum * >SHA256SUMS && ls -lh
      - uses: actions/upload-artifact@v4
        with: {name: "signage-${{ steps.v.outputs.version }}", path: dist/, compression-level: 0}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
