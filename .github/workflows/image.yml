name: image
on:
  push: {branches: [main], tags: ["v*"]}
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    # Signing secrets live in the protected `release` environment. Pull
    # requests don't get them and build with a throwaway dev key instead.
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install mkosi
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx bubblewrap uidmap zstd xz-utils debian-archive-keyring
          sudo pipx install --global git+https://github.com/systemd/mkosi.git@v25.3
      - name: Version
        id: v
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          else echo "version=$(cat mkosi.version).$(date -u +%y%m%d%H%M)" >>"$GITHUB_OUTPUT"; fi
      - name: Secure Boot key
        env:
          MOK_KEY: ${{ secrets.MOK_KEY }}
          MOK_CERT: ${{ secrets.MOK_CERT }}
        run: |
          umask 077
          if [[ -n $MOK_KEY && -n $MOK_CERT ]]; then
            printf '%s\n' "$MOK_KEY" >mkosi.key
            printf '%s\n' "$MOK_CERT" >mkosi.crt
            echo "Signing with the production MOK: $(openssl x509 -in mkosi.crt -noout -subject)"
          else
            echo "::warning::No MOK_KEY/MOK_CERT secret: signing with a throwaway dev key"
            sudo mkosi --genkey-common-name="Signage CI dev key (not for production)" genkey
            sudo chown "$USER" mkosi.key mkosi.crt
          fi
      - name: Build
        run: sudo mkosi --image-version=${{ steps.v.outputs.version }} -f build
      - name: Remove signing key
        if: always()
        run: sudo shred -u mkosi.key 2>/dev/null || true
      - name: Package
        run: |
          cd mkosi.output && sudo chown -R "$USER" .
          V=${{ steps.v.outputs.version }}; mkdir ../dist
          xz -T0 -6 -c signage_$V.raw >../dist/signage_$V.raw.xz
          # sysupdate.d expects signage_<version>.<partition>.<partuuid>.raw.zst:
          # the UKI's usrhash= finds /usr and its verity partition by UUID, so
          # updates must recreate them with the same UUIDs.
          uuid() { sfdisk -J signage_$V.raw | jq -r --arg n "$1" '.partitiontable.partitions[] | select(.name == $n) | .uuid | ascii_downcase'; }
          zstd -19 -T0 -q signage_$V.usr-x86-64.raw -o ../dist/signage_$V.usr-x86-64.$(uuid signage_usr_$V).raw.zst
          zstd -19 -T0 -q signage_$V.usr-x86-64-verity.raw -o ../dist/signage_$V.usr-x86-64-verity.$(uuid signage_verity_$V).raw.zst
          cp signage_$V.efi ../dist/
          cd ../dist && sha256sum * >SHA256SUMS
      - name: Sign SHA256SUMS
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          if [[ -z $RELEASE_GPG_KEY ]]; then
            echo "::warning::No RELEASE_GPG_KEY secret: SHA256SUMS is unsigned and players will refuse this release"
            exit 0
          fi
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --output dist/SHA256SUMS.gpg dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.gpg dist/SHA256SUMS
          rm -rf "$GNUPGHOME"
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with: {name: "signage-${{ steps.v.outputs.version }}", path: dist/, compression-level: 0}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
