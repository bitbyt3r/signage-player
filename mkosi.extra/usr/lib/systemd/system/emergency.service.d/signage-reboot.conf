# Nobody is at a player's keyboard (and root is locked), so an emergency
# shell helps no one: show what failed on tty1, wait 30 s, reboot. A new
# version that fails to boot after an OS update then uses up its boot tries
# (systemd-boot counts them, +3 in the UKI's name) and the player falls back
# to the previous version. The initrd gets this too (mkosi.sync).
[Unit]
SuccessAction=reboot
FailureAction=reboot

[Service]
ExecStartPre=
ExecStart=
ExecStart=-/usr/lib/signage/signage-emergency
