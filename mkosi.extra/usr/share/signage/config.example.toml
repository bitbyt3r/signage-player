# Signage player configuration.
#
# Edit this file on any computer, save it, and boot the stick. The installer
# copies it onto the machine. Settings changed later from the dashboard
# override what is here.

[device]
# Shown on the dashboard. Defaults to signage-<last 6 hex digits of the MAC>.
# name = "lobby-left"
timezone = "America/New_York"

[dashboard]
# url = "https://signage.example.com"
# enroll_token = ""

[network]
# Wired Ethernet with DHCP is always tried first. WiFi is used when there is
# no wired link. List as many networks as you like; higher priority wins.

# [[network.wifi]]
# ssid = "MAGFest-Signage"
# psk = "change-me"
# priority = 10
# hidden = false

[ntp]
# Extra NTP servers, tried before the public pool (e.g. a venue LAN server).
servers = []

[display]
# Leave mode empty to use the monitor's preferred mode.
# mode = "1920x1080@60"
# Set custom = true to force a mode the monitor doesn't advertise.
# custom = false
# Rotation in degrees: 0, 90, 180 or 270.
rotation = 0
# Connector to configure, e.g. "HDMI-A-1" or "DP-1". Default: every output.
# output = ""
# scale = 1.0
# What the screen is. "screen" (the default) is an ordinary monitor.
# "arch" is the entrance arch's LED wall: the player draws the header and
# both legs as one 2760x2565 picture and cuts it up into the 3840x2160
# map the LED controller expects (header at the top left, then the left
# and right leg strips). With "arch", mode defaults to "3840x2160".
# layout = "screen"

[player]
# The player plays whatever program the dashboard assigns. With no program
# (or no dashboard), it shows a status screen; demo = true shows the
# built-in demo graphic (an OGraf lower third) instead.
demo = false

[install]
# Disk to install to. Default: the only internal disk, else the first NVMe,
# else the largest.
# target = "/dev/nvme0n1"
# Seconds to wait on screen before wiping the target disk.
countdown = 15
# Secure Boot: the installer queues the image's signing certificate for
# enrollment (mokutil). On the first boot after install, the blue MokManager
# screen appears: press a key, choose "Enroll MOK", "Continue", "Yes", type
# this password, then "Reboot". See docs/secure-boot.md.
mok_password = "signage"
