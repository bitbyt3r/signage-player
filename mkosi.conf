# Signage player OS image.
#
# One image does two jobs. Flashed to a USB stick it boots as the installer
# (the stick carries a FAT32 SIGNCFG partition with config.toml); the
# installer copies itself onto the machine's internal disk and lays out
# A/B /usr slots for systemd-sysupdate. See docs/image.md.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,non-free-firmware

[Output]
Format=disk
ImageId=signage
# Output name defaults to signage_<version>; ImageVersion comes from build.sh.
OutputDirectory=mkosi.output
CompressOutput=no
SplitArtifacts=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=rw quiet loglevel=3 systemd.show_status=error
WithDocs=no
Locale=en_US.UTF-8
Timezone=America/New_York
Hostname=signage
# OGraf packages baked into the image (the demo graphic for now).
ExtraTrees=packages:/usr/share/signage/packages
# "hashed:" makes mkosi write this as-is (a locked password) instead of
# hashing "!*" as a plaintext password.
RootPassword=hashed:!*

Packages=
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-repart
        systemd-container
        systemd-sysv
        login
        udev
        dbus
        libpam-systemd
        linux-image-amd64
        firmware-amd-graphics
        firmware-realtek
        firmware-iwlwifi
        firmware-misc-nonfree
        network-manager
        wpasupplicant
        iw
        chrony
        ca-certificates
        cryptsetup-bin
        efibootmgr
        dosfstools
        e2fsprogs
        util-linux
        kbd
        python3
        cage
        wlr-randr
        firefox-esr
        fonts-dejavu-core
        fonts-noto-core
        fonts-noto-color-emoji
        curl
        jq
        less
        procps
        iproute2

# systemd-container is there for systemd-sysupdate (A/B /usr updates).

# The modules initrd only needs what finds and mounts /usr and the root
# partition: mkosi's default initrd list (dm-verity, erofs, ext4, vfat,
# usb-storage, sd_mod, virtio, ...) plus the NVMe, SATA and USB controllers
# and a keyboard for the emergency shell. Everything else, with its firmware,
# loads from /usr after switch-root. Without this every module (and 135 MB of
# GPU/WiFi firmware) went into the initrd. Include only works with an exclude.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
        /nvme.ko
        /ahci.ko
        /uas.ko
        /xhci-pci.ko
        /ehci-pci.ko
        /usbhid.ko
        /hid-generic.ko

RemoveFiles=
        # Debian kernel extras that CopyFiles=/boot would put on the ESP.
        /boot/System.map-*
        /boot/config-*
        /usr/share/doc
        /usr/share/man
        /usr/share/info

[Build]
ToolsTree=default
# Match the build tools to the image (MakeSymlinks= needs systemd-repart 257;
# an Ubuntu 24.04 host would otherwise get a tools tree with 255).
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
ToolsTreePackages=
        erofs-utils
        mtools
        dosfstools
