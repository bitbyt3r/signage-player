# Signage player OS image.
#
# One image does two jobs. Flashed to a USB stick it boots as the installer
# (the stick carries a FAT32 SIGNCFG partition with config.toml); the
# installer copies itself onto the machine's internal disk and lays out
# A/B /usr slots for systemd-sysupdate. See docs/image.md.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,non-free-firmware

[Output]
Format=disk
ImageId=signage
# Output name defaults to signage_<version>; ImageVersion comes from build.sh.
OutputDirectory=mkosi.output
CompressOutput=no
SplitArtifacts=yes
# 512-byte sectors like real USB sticks and disks. Left unset, systemd-repart
# formats the FAT partitions (ESP, SIGNCFG) of an image file with 4096-byte
# sectors; Linux copes, but macOS refuses to mount a FAT whose sector size
# isn't the device's ("disenter error 49,174"), so SIGNCFG couldn't be edited
# on a Mac. It also left the 256M SIGNCFG under FAT32's 65525-cluster minimum.
SectorSize=512

[Content]
# The initrd gets signage-boot-disk (initrd/, packed into mkosi.debs/ by
# mkosi.sync): it makes usrhash= find /usr on the disk we booted from even
# when the install stick and an installed disk are both attached.
PackageDirectories=mkosi.debs
InitrdPackages=signage-boot-disk
# systemd dlopen()s the TPM2 stack: without it, systemd-pcrphase*,
# systemd-tpm2-setup* and pcrextend fail on machines with a TPM (the M715q's
# AMD fTPM; tpm_crb and tpm_tis are built into Debian's kernel). Kept working
# for a TPM-sealed root later.
InitrdPackages=libtss2-esys-3.0.2-0t64,libtss2-rc0t64,libtss2-mu-4.0.1-0t64,libtss2-tcti-device0t64
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
# signage_<version>.efi, the name sysupdate's 60-uki.transfer matches (it
# adds +<tries> boot counting to the ones it installs). mkosi's default
# (signage-<kernel>-<usrhash>.efi) isn't matched, so the installed version
# showed up as "incomplete".
UnifiedKernelImageFormat=signage_%v
# Secure Boot: Microsoft-signed shim (Debian's shim-signed) is the first stage
# at EFI/BOOT/BOOTX64.EFI and chain-loads systemd-boot (EFI/BOOT/grubx64.EFI),
# which loads the UKI. systemd-boot and the UKI are signed with our MOK, which
# the installer queues for enrollment with mokutil. The signing key defaults
# to mkosi.key/mkosi.crt (gitignored): scripts/build.sh creates a dev key
# with `mkosi genkey` when they're missing, and CI passes the production MOK
# from the `release` environment. See docs/secure-boot.md.
SecureBoot=yes
ShimBootloader=signed
# We trust our key through shim's MOK list, not by replacing the firmware's
# own PK/KEK/db, so no systemd-boot auto-enrollment files on the ESP.
SecureBootAutoEnroll=no
# quiet + loglevel=3 keep kernel messages off the screen; systemd's own
# "[  OK  ] Started <description>" lines show under the signage banner so a
# booting player isn't a blank screen. The installer and the kiosk take tty1
# over when they start.
KernelCommandLine=rw quiet loglevel=3 systemd.show_status=yes systemd.status_unit_format=description
WithDocs=no
Locale=en_US.UTF-8
Timezone=America/New_York
Hostname=signage
# OGraf packages baked into the image (the demo graphic for now).
ExtraTrees=packages:/usr/share/signage/packages
# "hashed:" makes mkosi write this as-is (a locked password) instead of
# hashing "!*" as a plaintext password.
RootPassword=hashed:!*

Packages=
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-repart
        systemd-container
        systemd-sysv
        login
        udev
        dbus
        libpam-systemd
        linux-image-amd64
        firmware-amd-graphics
        firmware-realtek
        firmware-iwlwifi
        firmware-misc-nonfree
        network-manager
        wpasupplicant
        iw
        chrony
        ca-certificates
        cryptsetup-bin
        efibootmgr
        shim-signed
        mokutil
        dosfstools
        e2fsprogs
        util-linux
        kbd
        python3
        cage
        wlr-randr
        grim
        console-setup-linux
        gpg
        libtss2-esys-3.0.2-0t64
        libtss2-rc0t64
        libtss2-mu-4.0.1-0t64
        libtss2-tcti-device0t64
        firefox-esr
        fonts-dejavu-core
        fonts-noto-core
        fonts-noto-color-emoji
        curl
        jq
        less
        procps
        iproute2

# systemd-container is there for systemd-sysupdate (A/B /usr updates).

# The modules initrd only needs what finds and mounts /usr and the root
# partition: mkosi's default initrd list (dm-verity, erofs, ext4, vfat,
# usb-storage, sd_mod, virtio, ...) plus the NVMe, SATA and USB controllers
# and a keyboard for the emergency shell. Everything else, with its firmware,
# loads from /usr after switch-root. Without this every module (and 135 MB of
# GPU/WiFi firmware) went into the initrd. Include only works with an exclude.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
        /nvme.ko
        /ahci.ko
        /uas.ko
        /xhci-pci.ko
        /ehci-pci.ko
        /usbhid.ko
        /hid-generic.ko

RemoveFiles=
        # Debian kernel extras that CopyFiles=/boot would put on the ESP.
        /boot/System.map-*
        /boot/config-*
        # Debian's copy of the kernel; the UKI is built from
        # /usr/lib/modules/<kver>/vmlinuz, so this would only sit on the ESP.
        /boot/vmlinuz-*
        /usr/share/doc
        /usr/share/man
        /usr/share/info

[Build]
# Passed to systemd-repart: erofs physical cluster size for /usr (see
# mkosi.repart/10-usr.conf).
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-C262144
ToolsTree=default
# Match the build tools to the image (MakeSymlinks= needs systemd-repart 257;
# an Ubuntu 24.04 host would otherwise get a tools tree with 255).
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
ToolsTreePackages=
        erofs-utils
        mtools
        dosfstools
        openssl
        sbsigntool
